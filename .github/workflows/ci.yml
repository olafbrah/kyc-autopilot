name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check --line-length 120 kyc tests evals
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: kyc, POSTGRES_PASSWORD: kyc, POSTGRES_DB: kyc}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kyc" --health-interval 2s --health-retries 30
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: {TEST_DATABASE_URL: "postgresql+psycopg://kyc:kyc@localhost:5432/kyc"}

  agent-eval-gate:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      # Replays recorded model responses: no API key in CI. Fails on any false clear or cleared injection.
      - run: |
          if ls evals/cassettes/*.json >/dev/null 2>&1; then python -m evals.run --backend replay --gate
          else echo "::warning::no recorded model responses yet; eval gate skipped"; fi

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
